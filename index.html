<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="스마트제조혁신협회 평생교육원 | 국가자격시험 운영기관" />
    <meta name="keywords" content="스마트제조, 기능사, 기사, 자격시험, LMS" />
    <meta property="og:title" content="스마트제조혁신 LMS" />
    <meta property="og:description" content="스마트제조혁신협회 평생교육원 | 국가자격시험 운영기관" />
    <meta property="og:type" content="website" />
    <title>GrowAI - All in One Platform</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>G</text></svg>" />
    <!-- PWA 매니페스트 -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#C25B84" />
    <!-- iOS PWA 지원 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="스마트제조 LMS" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- 서비스 워커 등록 -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js')
            .then(function (reg) {
              console.log('[SW] 서비스 워커 등록 완료:', reg.scope);
            })
            .catch(function (err) {
              console.warn('[SW] 서비스 워커 등록 실패:', err);
            });
        });
      }
    </script>
  </body>
</html>
